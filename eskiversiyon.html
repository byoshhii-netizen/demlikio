<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demlik</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030107; font-family: 'Orbitron', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- LOCAL STORAGE & KULLANICI YÖNETİMİ ---
function getSavedData(key, defaultValue) { const saved = localStorage.getItem(key); return saved !== null ? JSON.parse(saved) : defaultValue; }
function saveData(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

let allUsers = getSavedData('dem_all_users', {});
let playerId = getSavedData('dem_player_id', null);
if (!playerId) {
    playerId = 'DEM-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    saveData('dem_player_id', playerId);
}
if (!allUsers[playerId]) {
    allUsers[playerId] = { coins: 0, sugar: 0, bomb: 0, potion: 0, hasDiamond: false, diamondDurability: 100, highScore: 0, endlessRecord: 0 };
    saveData('dem_all_users', allUsers);
}

let r2ScoreThreshold = getSavedData('dem_r2_score', 36);
let r2TimeLimit = getSavedData('dem_r2_time', 90); 

let tutorialShown = getSavedData('dem_tutorial_shown', false);
let showTutorial = false;
let currentLang = getSavedData('dem_lang', 'TR');
let musicVolume = getSavedData('dem_music_volume', 0.5);
let sfxVolume = getSavedData('dem_sfx_volume', 0.5);
let isMuted = getSavedData('dem_muted', false);
function syncUserData() { saveData('dem_all_users', allUsers); }

// --- MÜZİK ---
const MENU_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784245915/m%C3%BCzik1_ll86tm.mp3";
const GAME_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784245915/m%C3%BCzik2_spltqg.mp3";
const GAME2_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784245915/m%C3%BCzik3_xxxxx.mp3"; // 2. tur müziği (kendi dosyanla değiştir)

let bgAudio = new Audio(); bgAudio.loop = true; bgAudio.crossOrigin = "anonymous";
let audioCtx = null, currentMusicState = "MENU", isMusicLoaded = false, activeAudioSrc = "";

function initAudio() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!isMusicLoaded) { bgAudio.src = MENU_MUSIC; bgAudio.load(); isMusicLoaded = true; }
    playMusicForState(currentMusicState);
}
function playMusicForState(state) {
    if (isMuted) { bgAudio.pause(); return; }
    let src = (state === "MENU") ? MENU_MUSIC : (state === "GAME2" ? GAME2_MUSIC : GAME_MUSIC);
    if (activeAudioSrc !== src) { activeAudioSrc = src; bgAudio.src = src; bgAudio.load(); bgAudio.play().catch(()=>{}); } 
    else { if (bgAudio.paused) bgAudio.play().catch(()=>{}); }
    bgAudio.volume = musicVolume;
}
function toggleMute() { isMuted = !isMuted; saveData('dem_muted', isMuted); if (isMuted) bgAudio.pause(); else playMusicForState(currentMusicState); }
function setMusicVolume(val) { musicVolume = Math.max(0, Math.min(1, val)); saveData('dem_music_volume', musicVolume); if (!isMuted) bgAudio.volume = musicVolume; }
function setSfxVolume(val) { sfxVolume = Math.max(0, Math.min(1, val)); saveData('dem_sfx_volume', sfxVolume); }

function playSynthSFX(type) {
    if (!audioCtx) return; const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime, vol = sfxVolume;
    if (type === 'slash') { osc.type='triangle'; osc.frequency.setValueAtTime(600,now); osc.frequency.exponentialRampToValueAtTime(150,now+0.2); gain.gain.setValueAtTime(0.3*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2); osc.start(now); osc.stop(now+0.2); }
    else if (type === 'hit') { osc.type='sine'; osc.frequency.setValueAtTime(1000,now); osc.frequency.exponentialRampToValueAtTime(300,now+0.12); gain.gain.setValueAtTime(0.4*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.12); osc.start(now); osc.stop(now+0.12); }
    else if (type === 'coin') { osc.type='square'; osc.frequency.setValueAtTime(880,now); osc.frequency.setValueAtTime(1200,now+0.08); gain.gain.setValueAtTime(0.15*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.25); osc.start(now); osc.stop(now+0.25); }
    else if (type === 'explosion') { osc.type='sawtooth'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(10,now+0.6); gain.gain.setValueAtTime(0.6*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.6); osc.start(now); osc.stop(now+0.6); }
    else if (type === 'hurt') { osc.type='sawtooth'; osc.frequency.setValueAtTime(250,now); osc.frequency.linearRampToValueAtTime(50,now+0.35); gain.gain.setValueAtTime(0.4*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.35); osc.start(now); osc.stop(now+0.35); }
    else if (type === 'shoot') { osc.type='square'; osc.frequency.setValueAtTime(800,now); osc.frequency.exponentialRampToValueAtTime(400,now+0.1); gain.gain.setValueAtTime(0.2*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.1); osc.start(now); osc.stop(now+0.1); }
}

let gameState = "MENU";
let isSettingsOpen = false, showDevModal = false, shopOpenFromMenu = false, showInGameSettings = false;
let survivalTimer = 0, endlessTimer = 0;
let activeKeys = new Set();
const inputMap = { left: false, right: false, dash: false, down: false };
let selectedSlot = 0, currentScore = 0, mouseX = 0, mouseY = 0;
let difficultyLevel = 1;
let randomMessageTimer = 0, randomMessageText = "", randomMessageDisplay = 0;
const randomMessages = ["iso yaptı bu oyunu", "çay sevmeyen poh içsin", "CMS Team adamdır", "Oshi bir dahi", "İsocuk yaptı", "selam isocuk"];

let potionActive = false, potionTimer = 0, potionBonusHp = 0, potionBonusDamage = 0;

let adminPassInput = "";
let adminSelectedUserIndex = 0;
let adminUsersKeys = [];

const inventoryItems = [
    { id: 'normal', name: 'Katana', count: 1 }, 
    { id: 'bomb', name: 'Patlayıcı', count: () => allUsers[playerId]?.bomb || 0 }, 
    { id: 'diamond', name: 'Elmas', count: () => allUsers[playerId]?.hasDiamond ? 1 : 0 }, 
    { id: 'potion', name: 'Bergamot', count: () => allUsers[playerId]?.potion || 0 }, 
    { id: 'sugar', name: 'Şeker', count: () => allUsers[playerId]?.sugar || 0 }
];
const uiButtons = { 
    menuPlay: {x:0,y:0,w:280,h:50}, menuShop: {x:0,y:0,w:280,h:50}, menuSettings: {x:0,y:0,w:280,h:50}, menuDev: {x:0,y:0,w:280,h:50}, 
    volumeBar: {x:0,y:0,w:200,h:10}, sfxBar: {x:0,y:0,w:200,h:10}, closeBtn: {x:0,y:0,w:140,h:40}, 
    gameCart: {x:0,y:0,w:60,h:42}, pauseResume: {x:0,y:0,w:220,h:45}, pauseMute: {x:0,y:0,w:220,h:45}, 
    pauseSettings: {x:0,y:0,w:220,h:45}, pauseMenu: {x:0,y:0,w:220,h:45}, 
    tutorialClose: {x:0,y:0,w:180,h:46}, helpBtn: {x:0,y:0,w:44,h:44} 
};
let adminBtns = [];
const locale = {
    TR: { title: "Demlik", play: "OYUNA BAŞLA", shop: "MARKET", settings: "AYARLAR", dev: "GELİŞTİRİCİLER", 
          close: "KAPAT", paused: "OYUN DURDURULDU", resume: "DEVAM ET", mainMenu: "ANA MENÜ", 
          highscore: "REKOR", endless: "SONSUZLUK", coin: "PARA", level: "SEVİYE", score: "SKOR", 
          target: "HEDEF", time: "SÜRE", music: "MÜZİK", sfx: "SES EFECTI", lang: "DİL" },
    EN: { title: "Demlik", play: "START GAME", shop: "MARKET", settings: "SETTINGS", dev: "DEVELOPERS",
          close: "CLOSE", paused: "GAME PAUSED", resume: "RESUME", mainMenu: "MAIN MENU",
          highscore: "RECORD", endless: "ENDLESS", coin: "COINS", level: "LEVEL", score: "SCORE",
          target: "TARGET", time: "TIME", music: "MUSIC", sfx: "SFX", lang: "LANG" }
};

// --- GİRDİLER ---
window.addEventListener('keydown', (e) => {
    initAudio();
    let key = e.key.toLowerCase();
    
    if (gameState === "ADMIN_LOGIN") {
        if (e.key === "Enter") {
            if (adminPassInput === "1121") {
                gameState = "ADMIN_PANEL"; adminUsersKeys = Object.keys(allUsers); 
                adminSelectedUserIndex = adminUsersKeys.indexOf(playerId);
                if (adminSelectedUserIndex === -1) adminSelectedUserIndex = 0;
                playSynthSFX('coin');
            } else { gameState = "MENU"; playSynthSFX('hurt'); }
        } else if (e.key === "Escape") { gameState = "MENU"; }
        else if (e.key === "Backspace") { adminPassInput = adminPassInput.slice(0, -1); }
        else if (key.length === 1 && /[0-9]/.test(key)) { adminPassInput += key; }
        return;
    }

    activeKeys.add(key); updateInputs();
    
    if (gameState === "PLAYING" && (key === 'w' || key === ' ' || key === 'arrowup')) {
        if (demlik.grounded) {
            demlik.vy = demlik.jumpForce; demlik.grounded = false; demlik.canDoubleJump = true; playSynthSFX('slash');
        } else if (demlik.canDoubleJump) {
            demlik.vy = demlik.jumpForce; demlik.canDoubleJump = false; playSynthSFX('slash');
            spawnParticles(demlik.x + demlik.width/2, demlik.y + demlik.height, '#00ffff', 15, 1.5);
        }
    }

    if (e.key === 'Escape') {
        if (gameState === "PLAYING") { gameState = "PAUSED"; showInGameSettings = false; } 
        else if (gameState === "PAUSED") { if (showInGameSettings) showInGameSettings = false; else gameState = "PLAYING"; } 
        else if (gameState === "IN_GAME_SHOP") { gameState = "PLAYING"; shopOpenFromMenu = false; } 
        else if (gameState === "MENU_SHOP") { gameState = "MENU"; shopOpenFromMenu = false; } 
        else if (gameState === "MENU") { isSettingsOpen = false; shopOpenFromMenu = false; showDevModal = false; }
        else if (gameState === "ADMIN_PANEL") { gameState = "MENU"; syncUserData(); }
    }
    if (e.key === 'Enter' || key === ' ') {
        if (gameState === "MENU" && !isSettingsOpen && !shopOpenFromMenu && !showDevModal) startSurvivalGame();
        else if (gameState === "GAMEOVER" || gameState === "GAMEOVER_SCORE") { gameState = "MENU"; }
    }
    if (['1','2','3','4','5'].includes(e.key)) selectedSlot = parseInt(e.key)-1;
    if (key === 'q') { if (gameState === "PLAYING") { demlik.facing = -1; useSelectedItem(); } }
    if (key === 'e') { if (gameState === "PLAYING") { demlik.facing = 1; useSelectedItem(); } }
    if (key === 'm') {
        if (gameState === "PLAYING") { if (gameState === "IN_GAME_SHOP") { gameState = "PLAYING"; shopOpenFromMenu = false; } else { gameState = "IN_GAME_SHOP"; shopOpenFromMenu = true; playSynthSFX('hit'); } } 
        else if (gameState === "MENU" && !isSettingsOpen && !showDevModal) { if (shopOpenFromMenu) { shopOpenFromMenu = false; gameState = "MENU"; } else { gameState = "MENU_SHOP"; shopOpenFromMenu = true; playSynthSFX('hit'); } } 
    }
    if (key === '"' || key === 'i') { 
        if (gameState !== "CHEAT_PANEL") { 
            if (!window._prevState) window._prevState = gameState;
            gameState = "CHEAT_PANEL"; 
            cheatCodeInput = ""; 
            playSynthSFX('hit'); 
        } else { 
            gameState = window._prevState || "MENU"; 
            window._prevState = null;
        }
    }
});
window.addEventListener('keyup', (e) => { activeKeys.delete(e.key.toLowerCase()); updateInputs(); });
window.addEventListener('wheel', (e) => { if (gameState === "PLAYING") { if (e.deltaY > 0) selectedSlot = (selectedSlot+1)%5; else selectedSlot = (selectedSlot-1+5)%5; } });

let isDraggingVolume = false, isDraggingSfx = false;
let cheatCodeInput = "";

window.addEventListener('mousedown', (e) => {
    initAudio(); const mx = e.clientX, my = e.clientY;
    
    if (showTutorial) { let t = uiButtons.tutorialClose; if (mx >= t.x && mx <= t.x+t.w && my >= t.y && my <= t.y+t.h) { showTutorial = false; tutorialShown = true; saveData('dem_tutorial_shown', true); playSynthSFX('hit'); return; } return; }
    if (gameState === "GAMEOVER" || gameState === "GAMEOVER_SCORE") { gameState = "MENU"; shopOpenFromMenu = false; playSynthSFX('hit'); return; }

    if (gameState === "MENU" && !isSettingsOpen && !showDevModal && !shopOpenFromMenu) {
        let borderThickness = 15;
        let onLeft = mx >= 20-borderThickness && mx <= 20+borderThickness && my >= 20 && my <= canvas.height-20;
        let onRight = mx >= canvas.width-20-borderThickness && mx <= canvas.width-20+borderThickness && my >= 20 && my <= canvas.height-20;
        let onTop = my >= 20-borderThickness && my <= 20+borderThickness && mx >= 20 && mx <= canvas.width-20;
        let onBot = my >= canvas.height-20-borderThickness && my <= canvas.height-20+borderThickness && mx >= 20 && mx <= canvas.width-20;
        if (onLeft || onRight || onTop || onBot) { gameState = "ADMIN_LOGIN"; adminPassInput = ""; playSynthSFX('hit'); return; }
    }

    if (gameState === "MENU" && isSettingsOpen) {
        let bar = uiButtons.volumeBar; if (mx >= bar.x && mx <= bar.x + bar.w && my >= bar.y - 10 && my <= bar.y + bar.h + 10) { setMusicVolume(Math.max(0, Math.min(1, (mx - bar.x) / bar.w))); isDraggingVolume = true; return; }
        let sbar = uiButtons.sfxBar; if (mx >= sbar.x && mx <= sbar.x + sbar.w && my >= sbar.y - 10 && my <= sbar.y + sbar.h + 10) { setSfxVolume(Math.max(0, Math.min(1, (mx - sbar.x) / sbar.w))); isDraggingSfx = true; return; }
        if (uiButtons.langBtn && mx >= uiButtons.langBtn.x && mx <= uiButtons.langBtn.x+uiButtons.langBtn.w && my >= uiButtons.langBtn.y && my <= uiButtons.langBtn.y+uiButtons.langBtn.h) {
            currentLang = currentLang === 'TR' ? 'EN' : 'TR'; saveData('dem_lang', currentLang); playSynthSFX('hit');
        }
        let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { isSettingsOpen = false; playSynthSFX('hit'); } return;
    }
    
    if (gameState === "ADMIN_PANEL") {
        let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { gameState = "MENU"; syncUserData(); playSynthSFX('hit'); return; }
        if (uiButtons.prevUser && mx >= uiButtons.prevUser.x && mx <= uiButtons.prevUser.x+uiButtons.prevUser.w && my >= uiButtons.prevUser.y && my <= uiButtons.prevUser.y+uiButtons.prevUser.h) {
            adminSelectedUserIndex = (adminSelectedUserIndex - 1 + adminUsersKeys.length) % adminUsersKeys.length; playSynthSFX('hit'); return;
        }
        if (uiButtons.nextUser && mx >= uiButtons.nextUser.x && mx <= uiButtons.nextUser.x+uiButtons.nextUser.w && my >= uiButtons.nextUser.y && my <= uiButtons.nextUser.y+uiButtons.nextUser.h) {
            adminSelectedUserIndex = (adminSelectedUserIndex + 1) % adminUsersKeys.length; playSynthSFX('hit'); return;
        }
        let sUser = allUsers[adminUsersKeys[adminSelectedUserIndex]];
        adminBtns.forEach(b => {
            if (mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) {
                if (b.action === 'coin+') sUser.coins += 100; else if (b.action === 'coin-') sUser.coins = Math.max(0, sUser.coins-100);
                if (b.action === 'sug+') sUser.sugar += 5; else if (b.action === 'sug-') sUser.sugar = Math.max(0, sUser.sugar-5);
                if (b.action === 'r2sc+') r2ScoreThreshold += 5; else if (b.action === 'r2sc-') r2ScoreThreshold = Math.max(0, r2ScoreThreshold-5);
                if (b.action === 'r2tm+') r2TimeLimit += 10; else if (b.action === 'r2tm-') r2TimeLimit = Math.max(0, r2TimeLimit-10);
                syncUserData(); saveData('dem_r2_score', r2ScoreThreshold); saveData('dem_r2_time', r2TimeLimit);
                playSynthSFX('coin');
            }
        });
        return;
    }

    if (gameState === "MENU") {
        if (showDevModal) {
            let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { showDevModal = false; playSynthSFX('hit'); return; }
            if (uiButtons.devLink1 && mx >= uiButtons.devLink1.x && mx <= uiButtons.devLink1.x+uiButtons.devLink1.w && my >= uiButtons.devLink1.y && my <= uiButtons.devLink1.y+uiButtons.devLink1.h) { window.open('https://teatube.xyz', '_blank'); playSynthSFX('hit'); return; }
            if (uiButtons.devLink2 && mx >= uiButtons.devLink2.x && mx <= uiButtons.devLink2.x+uiButtons.devLink2.w && my >= uiButtons.devLink2.y && my <= uiButtons.devLink2.y+uiButtons.devLink2.h) { window.open('https://defterdar.xyz', '_blank'); playSynthSFX('hit'); return; }
            return;
        }
        if (shopOpenFromMenu) { let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { shopOpenFromMenu = false; playSynthSFX('hit'); return; } handleShopClick(mx, my); return; }
        let p = uiButtons.menuPlay; if (mx >= p.x && mx <= p.x+p.w && my >= p.y && my <= p.y+p.h) { startSurvivalGame(); return; }
        let s = uiButtons.menuShop; if (mx >= s.x && mx <= s.x+s.w && my >= s.y && my <= s.y+s.h) { gameState = "MENU_SHOP"; shopOpenFromMenu = true; playSynthSFX('hit'); return; }
        let st = uiButtons.menuSettings; if (mx >= st.x && mx <= st.x+st.w && my >= st.y && my <= st.y+st.h) { isSettingsOpen = true; playSynthSFX('hit'); return; }
        let dev = uiButtons.menuDev; if (mx >= dev.x && mx <= dev.x+dev.w && my >= dev.y && my <= dev.y+dev.h) { showDevModal = true; playSynthSFX('hit'); return; }
    }
    else if (gameState === "MENU_SHOP" || gameState === "IN_GAME_SHOP") {
        let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { if (gameState === "MENU_SHOP") { gameState = "MENU"; } else { gameState = "PLAYING"; } shopOpenFromMenu = false; playSynthSFX('hit'); return; }
        handleShopClick(mx, my);
    }
    else if (gameState === "PLAYING") {
        let hb = uiButtons.helpBtn; if (mx >= hb.x && mx <= hb.x+hb.w && my >= hb.y && my <= hb.y+hb.h) { showTutorial = true; playSynthSFX('hit'); return; }
        let cart = uiButtons.gameCart; if (mx >= cart.x && mx <= cart.x+cart.w && my >= cart.y && my <= cart.y+cart.h) { gameState = "IN_GAME_SHOP"; shopOpenFromMenu = true; playSynthSFX('hit'); return; }
        if (e.button === 0) useSelectedItem();
    }
    else if (gameState === "PAUSED") {
        let b = uiButtons;
        if (showInGameSettings) {
            let bar = uiButtons.volumeBar; if (mx >= bar.x && mx <= bar.x + bar.w && my >= bar.y - 10 && my <= bar.y + bar.h + 10) { setMusicVolume(Math.max(0, Math.min(1, (mx - bar.x) / bar.w))); isDraggingVolume = true; return; }
            let sbar = uiButtons.sfxBar; if (mx >= sbar.x && mx <= sbar.x + sbar.w && my >= sbar.y - 10 && my <= sbar.y + sbar.h + 10) { setSfxVolume(Math.max(0, Math.min(1, (mx - sbar.x) / sbar.w))); isDraggingSfx = true; return; }
            let c = uiButtons.closeBtn; if (mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { showInGameSettings = false; playSynthSFX('hit'); return; }
        } else {
            if (mx >= b.pauseResume.x && mx <= b.pauseResume.x+b.pauseResume.w && my >= b.pauseResume.y && my <= b.pauseResume.y+b.pauseResume.h) { showInGameSettings = false; gameState = "PLAYING"; playSynthSFX('hit'); }
            else if (mx >= b.pauseSettings.x && mx <= b.pauseSettings.x+b.pauseSettings.w && my >= b.pauseSettings.y && my <= b.pauseSettings.y+b.pauseSettings.h) { showInGameSettings = true; playSynthSFX('hit'); }
            else if (mx >= b.pauseMute.x && mx <= b.pauseMute.x+b.pauseMute.w && my >= b.pauseMute.y && my <= b.pauseMute.y+b.pauseMute.h) { toggleMute(); playSynthSFX('hit'); }
            else if (mx >= b.pauseMenu.x && mx <= b.pauseMenu.x+b.pauseMenu.w && my >= b.pauseMenu.y && my <= b.pauseMenu.y+b.pauseMenu.h) { showInGameSettings = false; gameState = "MENU"; shopOpenFromMenu = false; playSynthSFX('hit'); }
        }
    }
    if (gameState === "CHEAT_PANEL") {
        let c = uiButtons.cheatClose; 
        if (c && mx >= c.x && mx <= c.x+c.w && my >= c.y && my <= c.y+c.h) { 
            gameState = window._prevState || "MENU"; 
            window._prevState = null; 
            playSynthSFX('hit'); 
        }
    }
});

window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    if (isDraggingVolume) { let bar = uiButtons.volumeBar; setMusicVolume(Math.max(0, Math.min(1, (mouseX - bar.x) / bar.w))); }
    if (isDraggingSfx) { let sbar = uiButtons.sfxBar; setSfxVolume(Math.max(0, Math.min(1, (mouseX - sbar.x) / sbar.w))); }
    let isHovering = false;
    if (gameState === "MENU") {
        if (isSettingsOpen || showDevModal || gameState === "ADMIN_PANEL") isHovering = true;
        else if (shopOpenFromMenu) { if (mxIn(uiButtons.closeBtn)) isHovering=true; shopItems.forEach(item => { if (mxIn(item)) isHovering=true; }); }
        else { 
            let p=uiButtons.menuPlay,s=uiButtons.menuShop,st=uiButtons.menuSettings,dev=uiButtons.menuDev; 
            if (mxIn(p)||mxIn(s)||mxIn(st)||mxIn(dev)) isHovering=true;
            let borderThickness = 15;

let bombs = [];
function spawnBomb(x,y) { 
    bombs.push({ x, y, vy: 0, timer: 180, radius: 120 }); 
}
function updateAndDrawBombs() {
    for (let i=bombs.length-1; i>=0; i--) {
        let b = bombs[i];
        // Fizik: yerçekimi
        b.vy += 0.5;
        b.y += b.vy;

        platforms.forEach(p => {
            if (b.x > p.x && b.x < p.x + p.width && b.y >= p.y && b.y - b.vy <= p.y + 10) {
                b.y = p.y;

                    let dx = enemy.x+enemy.width/2-b.x, dy = enemy.y+enemy.height/2-b.y, dist = Math.sqrt(dx*dx+dy*dy);

// --- ARENA ---
let platforms = [];
function generateArena(level) {
    platforms = []; const floorY = canvas.height - 120;
    let arenaWidth = level === 1 ? 2400 : 4000;
    platforms.push({ x: 0, y: floorY, width: arenaWidth, height: 40, isFloor: true });
    const layer1Y = floorY - 130, layer2Y = floorY - 260, layer3Y = floorY - 390;
    let currX = 200;
    while(currX < arenaWidth - 250) {
        let pw = 150 + Math.random() * 200;
        let pY = Math.random() < 0.4 ? layer1Y : (Math.random() < 0.7 ? layer2Y : layer3Y);
        platforms.push({ x: currX, y: pY, width: pw, height: 16, isFloor: false });
        currX += pw + 200 + Math.random() * 300;
    }
}

        if (this.isSlashing && this.type !== 'shooter') {
            ctx.strokeStyle = '#ff1744'; ctx.lineWidth = 5; ctx.shadowBlur = 20; ctx.shadowColor = '#ff1744'; ctx.lineCap = 'round'; ctx.beginPath();
            let progress = (7 - this.slashTimer) / 7;
            if (this.direction === 1) { let startAng = -Math.PI / 2 + progress * Math.PI * 0.4; let endAng = startAng + Math.PI * 0.6; ctx.arc(this.x + this.width, this.y + this.height / 2, this.slashRange, startAng, endAng); } 
            else { let startAng = Math.PI * 1.5 - progress * Math.PI * 0.4; let endAng = startAng - Math.PI * 0.6; ctx.arc(this.x, this.y + this.height / 2, this.slashRange, startAng, endAng, true); }
            ctx.stroke();

        if (this.type === 'shooter') {

            else if (dist > 350) this.direction = dx > 0 ? 1 : -1;
            else this.direction = 0; 
            if (Math.abs(this.direction) > 0) this.x += this.direction * this.speed;

        if (this.x < 0) this.x = 0; if (this.x + this.width > arenaWidth) this.x = arenaWidth - this.width;
        if (this.isSlashing) { this.slashTimer--; if (this.slashTimer <= 0) this.isSlashing = false; }
        if (this.type !== 'shooter') {
            this.attackCooldown++;
            if (Math.abs(dx) < this.slashRange && this.attackCooldown > this.attackDelay && Math.abs(dy) < 60) {
                this.attackCooldown = 0; this.isSlashing = true; this.slashTimer = 7; playSynthSFX('slash');
                let attackX = this.direction === 1 ? this.x + this.width : this.x - this.slashRange;
                if (attackX < demlik.x + demlik.width && attackX + this.slashRange > demlik.x && this.y - 20 < demlik.y + demlik.height && this.y + this.height + 20 > demlik.y) { demlik.takeDamage(); }
            }
        }
        if (this.y > canvas.height + 500) { this.alive = false; }
    }
    takeDamage(dmg) {
        this.hp -= dmg; hitstopTimer = 4; camera.shakeTimer = 8; camera.shakeIntensity = 6; playSynthSFX('hit');
        if (this.hp <= 0) {
            this.alive = false; currentScore += 2; 
            if (currentScore > allUsers[playerId].highScore) { allUsers[playerId].highScore = currentScore; syncUserData(); }
            let coinCount = Math.floor(Math.random() * 3) + 1; for (let i = 0; i < coinCount; i++) { coins.push(new Coin(this.x + this.width / 2, this.y + this.height / 2)); }
            let color = '#6d4c41'; if (this.type === 'hamburger') color = '#ffb300'; if (this.type === 'cola') color = '#e53935'; if (this.type === 'shooter') color = '#00ff66';
            spawnParticles(this.x + this.width / 2, this.y + this.height / 2, color, 12, 1.1);
        }
    }
}
function manageSpawning() {
    enemies = enemies.filter(e => e.alive);
    let maxAlive = difficultyLevel === 1 ? 5 : 10; 
    if (enemies.length < maxAlive) {
        const floorY = canvas.height - 120;
        let types = difficultyLevel === 1 ? ['coffee', 'cola', 'hamburger'] : ['coffee', 'cola', 'hamburger', 'shooter', 'shooter'];
        let randomType = types[Math.floor(Math.random() * types.length)];
        let dir = Math.random() > 0.5 ? 1 : -1;
        let spawnDistance = 600 + Math.random() * 400;
        let spawnX = demlik.x + dir * spawnDistance;
        let aw = difficultyLevel === 1 ? 2400 : 4000;
        if (spawnX < 100) spawnX = aw - spawnDistance; 
        if (spawnX > aw - 100) spawnX = spawnDistance;
        enemies.push(new Enemy(spawnX, floorY - 44, randomType, difficultyLevel));
    }
}

// --- SİSTEM ---
let particles = []; function spawnParticles(x,y,color,count,speed=1) { for (let i=0; i<count; i++) { particles.push({ x, y, vx:(Math.random()-0.5)*8*speed, vy:(Math.random()-0.5)*8*speed-1, radius:Math.random()*4+1.5, color, alpha:1, decay:Math.random()*0.02+0.015, gravityY:0.18 }); } }
let camera = { x:0, y:0, targetX:0, shakeTimer:0, shakeIntensity:0 }, hitstopTimer = 0; const gravity = 0.55;

// --- YARDIMCI FONKSİYON: süreyi dakika:saniye (veya saat:dakika:saniye) formatına çevirir ---
function formatTime(seconds) {
    let hrs = Math.floor(seconds / 3600);
    let mins = Math.floor((seconds % 3600) / 60);
    let secs = seconds % 60;
    if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    else return `${mins}:${secs.toString().padStart(2,'0')}`;
}

function advanceLevel() {
    difficultyLevel++;
    spawnParticles(demlik.x + demlik.width/2, demlik.y + demlik.height/2, '#ff003c', 50, 3);
    playSynthSFX('explosion');
    generateArena(difficultyLevel);
    endlessTimer = 0;
    // 2. tura geçildiğinde müziği değiştir
    if (difficultyLevel === 2) {
        currentMusicState = "GAME2";
        playMusicForState("GAME2");
    }
}

function startSurvivalGame() {
    if (!tutorialShown) {
        showTutorial = true;
        return;
    }
    _doStartGame();
}

function _doStartGame() {
    gameState = "PLAYING"; showInGameSettings = false; shopOpenFromMenu = false; difficultyLevel = 1; survivalTimer = r2TimeLimit * 60; endlessTimer = 0;
    if (potionActive) { demlik.scaleRatio = 1; demlik.width = 60; demlik.height = 48; demlik.slashRange = 130; demlik.maxHp -= potionBonusHp; demlik.hp = Math.min(demlik.hp, demlik.maxHp); demlik.damagePower -= potionBonusDamage; potionActive = false; potionTimer = 0; potionBonusHp = 0; potionBonusDamage = 0; }
    demlik.hp = 3; demlik.maxHp = 3; demlik.damagePower = 1; demlik.dashStamina = 2; demlik.dashRegenTimer = 0; demlik.x = 200; demlik.y = 400; demlik.vx = 0; demlik.vy = 0; demlik.canDoubleJump = false;
    currentScore = 0; enemies = []; bombs = []; coins = []; playerProjectiles = []; enemyProjectiles = [];
    generateArena(difficultyLevel);
    const floorY = canvas.height - 120; enemies.push(new Enemy(800, floorY-44, 'coffee', difficultyLevel)); enemies.push(new Enemy(1200, floorY-44, 'cola', difficultyLevel));
    currentMusicState = "GAME"; playMusicForState("GAME");
    randomMessageTimer = 300 + Math.floor(Math.random() * 300);
}

// --- GÜNCELLEME ---
function update() {
    if (gameState === "PLAYING") {
        if (hitstopTimer > 0) { hitstopTimer--; return; }
        if (difficultyLevel === 1) {
            if (r2TimeLimit > 0) {
                survivalTimer--;
                if (survivalTimer <= 0) {
                    if (currentScore >= r2ScoreThreshold) advanceLevel();
                    else gameState = "GAMEOVER_SCORE";
                }
            } else {
                if (currentScore >= r2ScoreThreshold) advanceLevel();
            }
        } else {
            if (Math.floor(Date.now() / 1000) > endlessTimer) {
                endlessTimer++;
                if (endlessTimer > allUsers[playerId].endlessRecord) { allUsers[playerId].endlessRecord = endlessTimer; syncUserData(); }
            }
        }
        if (randomMessageTimer > 0) { randomMessageTimer--; } else { randomMessageText = randomMessages[Math.floor(Math.random() * randomMessages.length)]; randomMessageDisplay = 120; randomMessageTimer = 300 + Math.floor(Math.random() * 600); }
        if (randomMessageDisplay > 0) { randomMessageDisplay--; }
        if (potionActive) { potionTimer--; if (potionTimer <= 0) { demlik.maxHp -= potionBonusHp; demlik.hp = Math.min(demlik.hp, demlik.maxHp); demlik.damagePower -= potionBonusDamage; potionActive = false; potionBonusHp = 0; potionBonusDamage = 0; demlik.scaleRatio = 1; demlik.width = 60; demlik.height = 48; demlik.slashRange = 130; spawnParticles(demlik.x+demlik.width/2, demlik.y+demlik.height/2, '#ff6600', 15, 1.2); } }
        demlik.update(); enemies.forEach(enemy => enemy.update()); coins.forEach(coin => coin.update()); coins = coins.filter(c => !c.collected);
        playerProjectiles.forEach(p => p.update()); playerProjectiles = playerProjectiles.filter(p => p.active);
        enemyProjectiles.forEach(p => p.update()); enemyProjectiles = enemyProjectiles.filter(p => p.active);
        updateAndDrawBombs(); manageSpawning();
        demlik.grounded = false;
        platforms.forEach(p => { if (inputMap.down && !p.isFloor) return; if (demlik.x+demlik.width > p.x && demlik.x < p.x+p.width && demlik.y+demlik.height >= p.y && demlik.y+demlik.height-demlik.vy <= p.y+12) { demlik.y = p.y - demlik.height; demlik.vy = 0; demlik.grounded = true; demlik.canDoubleJump = true; } });
        for (let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravityY; p.alpha -= p.decay; if (p.alpha <= 0) particles.splice(i,1); }
        camera.targetX = demlik.x - canvas.width/2;
        let aw = difficultyLevel === 1 ? 2400 : 4000;
        let maxX = aw - canvas.width; if (maxX < 0) maxX = 0;
        camera.targetX = Math.max(0, Math.min(maxX, camera.targetX)); camera.x += (camera.targetX - camera.x) * 0.08;
        if (camera.shakeTimer > 0) { camera.x += (Math.random()-0.5)*camera.shakeIntensity; camera.shakeTimer--; }
    }
}

    adminBtns = []; ctx.textAlign = 'left'; ctx.font = '16px Arial, sans-serif';

        ctx.fillStyle = '#cccccc'; ctx.fillText(label, px+50, py+yOff); ctx.fillStyle = '#ffd700'; ctx.fillText(value, px+370, py+yOff);

        adminBtns.push(bM, bP);
    };

    createRow("Şeker (Slot5):", selectedData.sugar, 'sug-', 'sug+', 175);

}

function drawMarketUI() {
    let L = currentLang === 'TR' ? locale.TR : locale.EN;
    let cu = allUsers[playerId] || {coins:0};
    ctx.fillStyle='rgba(5,1,15,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height); 
    const panelW=880, panelH=360, panelX=(canvas.width-panelW)/2, panelY=(canvas.height-panelH)/2;
    ctx.fillStyle='#100520'; ctx.strokeStyle='#ff007f'; ctx.lineWidth=3; ctx.shadowBlur=20; ctx.shadowColor='#ff007f'; ctx.fillRect(panelX,panelY,panelW,panelH); ctx.strokeRect(panelX,panelY,panelW,panelH); ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff'; ctx.font='bold 28px "Orbitron"'; ctx.textAlign='center'; ctx.fillText(L.shop, canvas.width/2, panelY+45); 
    ctx.fillStyle='#ffd700'; ctx.font='bold 20px "Orbitron"'; ctx.fillText(`${L.coin}: ${cu.coins}`, canvas.width/2, panelY+80);
    const totalItems=shopItems.length, itemGap=20, startX=panelX+(panelW-(totalItems*180+(totalItems-1)*itemGap))/2;
    shopItems.forEach((item,index) => {
        item.x=startX+index*(item.w+itemGap); item.y=panelY+115; 
        ctx.fillStyle='#1b072e'; ctx.strokeStyle='#00ffff'; ctx.lineWidth=2; ctx.fillRect(item.x,item.y,item.w,item.h); ctx.strokeRect(item.x,item.y,item.w,item.h);
        if (item.id==='bomb') drawPixelBomb(item.x+30, item.y+40); else if (item.id==='diamond') drawPixelWeapon(item.x+30, item.y+40, '#00fffc'); else if (item.id==='potion') drawPixelPotion(item.x+30, item.y+40); else if (item.id==='sugar') drawPixelSugar(item.x+30, item.y+40);
        ctx.fillStyle='#ffffff'; ctx.font='bold 14px "Orbitron"'; ctx.textAlign='left'; ctx.fillText(item.name, item.x+60, item.y+32); ctx.fillStyle='#ffd700'; ctx.font='bold 14px "Orbitron"';
        if (item.id==='diamond' && cu.hasDiamond) { ctx.fillStyle='#00ffff'; ctx.fillText(`%${cu.diamondDurability}`, item.x+60, item.y+60); } else { ctx.fillText(`${item.cost} ${L.coin}`, item.x+60, item.y+60); }
    });
    let cW=140,cH=40,cX=(canvas.width-cW)/2,cY=panelY+290; uiButtons.closeBtn = { x:cX, y:cY, w:cW, h:cH }; 
    drawMenuButton(uiButtons.closeBtn, L.close, mxIn(uiButtons.closeBtn), '#ff0055', '#880022');
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
