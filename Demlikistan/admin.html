<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demlik Online Yönetim</title>
  <style>
    body{margin:0;background:#080512;color:#eee;font:16px Arial,sans-serif;padding:28px}main{max-width:1100px;margin:auto}h1{color:#00e5ff}input,textarea,button{padding:12px;border:1px solid #694080;background:#130d24;color:#fff}button{cursor:pointer;border-color:#00e5ff}.toolbar{display:flex;gap:10px;margin:20px 0;align-items:center}table{width:100%;border-collapse:collapse;background:#100a1d}th,td{padding:12px;text-align:left;border-bottom:1px solid #30203d}th{color:#00e5ff}.online{color:#00ff66}.offline{color:#ff6688}.error{color:#ff6688}.muted{color:#a9a0b8}.tabs{display:flex;gap:10px;margin:24px 0}.tab.active{background:#00e5ff;color:#080512}.contentBox{display:none}.contentBox.active{display:block}.contentBox textarea{width:100%;min-height:580px;resize:vertical;font:13px Consolas,monospace;line-height:1.45}.success{color:#00ff66}
  </style>
</head>
<body><main>
  <h1>DEMLİK ONLINE / YÖNETİM</h1>
  <section id="login"><p>Canlı oyuncuları görmek için admin parolasını gir.</p><div class="toolbar"><input id="password" type="password" placeholder="Admin parolası"><button id="loginBtn">Giriş</button></div><p id="message" class="error"></p></section>
  <section id="panel" hidden><div class="tabs"><button class="tab active" id="playersTab">Oyuncular</button><button class="tab" id="contentTab">Oyun Yazıları</button></div><div class="contentBox active" id="playersBox"><div class="toolbar"><button id="refreshBtn">Yenile</button><span id="updated" class="muted"></span></div><table><thead><tr><th>Oyuncu</th><th>Durum</th><th>Oyun</th><th>Skor</th><th>Seviye</th><th>Son görülme</th></tr></thead><tbody id="players"></tbody></table></div><div class="contentBox" id="contentBox"><p>Türkçe/İngilizce tüm arayüz yazılarını, rastgele sözleri ve market adlarını bu JSON içinden değiştir. Kaydettikten sonra oyuncular oyunu yenilediğinde yeni içerik gelir.</p><textarea id="contentEditor" spellcheck="false"></textarea><div class="toolbar"><button id="loadContentBtn">İçeriği Yenile</button><button id="saveContentBtn">İçeriği Kaydet</button><span id="contentMessage" class="muted"></span></div></div></section>
</main><script>
let token = sessionStorage.getItem('demlik_admin_token');
const $ = id => document.getElementById(id);
async function login(){const response=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value})});const data=await response.json();if(!response.ok){$('message').textContent=data.error||'Giriş başarısız';return}token=data.token;sessionStorage.setItem('demlik_admin_token',token);$('login').hidden=true;$('panel').hidden=false;loadPlayers()}
async function loadPlayers(){const response=await fetch('/api/admin/players',{headers:{'x-admin-token':token}});if(response.status===401){sessionStorage.removeItem('demlik_admin_token');location.reload();return}const data=await response.json();$('players').innerHTML=data.players.map(player=>{const profile=player.profile||{};return `<tr><td>${player.display_name||player.player_id}<br><span class="muted">${player.player_id} · Para: ${profile.coins||0} / Rekor: ${profile.highScore||0}</span></td><td class="${player.online?'online':'offline'}">${player.online?'ÇEVRİMİÇİ':'ÇEVRİMDIŞI'}</td><td>${player.state||'-'}${player.is_playing?' / OYNUYOR':''}</td><td>${player.score||0}</td><td>${player.level||1}</td><td>${player.last_seen_at?new Date(player.last_seen_at).toLocaleString('tr-TR'):'-'}</td></tr>`}).join('')||'<tr><td colspan="6">Henüz kayıtlı oyuncu yok.</td></tr>';$('updated').textContent='Son güncelleme: '+new Date().toLocaleTimeString('tr-TR')}
async function loadContent(){const response=await fetch('/api/admin/content',{headers:{'x-admin-token':token}});if(!response.ok){$('contentMessage').textContent='İçerik alınamadı';return}const data=await response.json();$('contentEditor').value=JSON.stringify(data.content,null,2);$('contentMessage').textContent='Yüklendi'}
async function saveContent(){let content;try{content=JSON.parse($('contentEditor').value)}catch(error){$('contentMessage').textContent='JSON biçimi hatalı';return}const response=await fetch('/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({content})});$('contentMessage').textContent=response.ok?'Kaydedildi':'Kaydedilemedi';if(response.ok)$('contentMessage').className='success'}
function showTab(tab){$('playersBox').classList.toggle('active',tab==='players');$('contentBox').classList.toggle('active',tab==='content');$('playersTab').classList.toggle('active',tab==='players');$('contentTab').classList.toggle('active',tab==='content');if(tab==='content')loadContent()}
$('loginBtn').onclick=login;$('refreshBtn').onclick=loadPlayers;$('playersTab').onclick=()=>showTab('players');$('contentTab').onclick=()=>showTab('content');$('loadContentBtn').onclick=loadContent;$('saveContentBtn').onclick=saveContent;if(token){$('login').hidden=true;$('panel').hidden=false;loadPlayers()}setInterval(()=>{if(token&&!$('panel').hidden&&$('playersBox').classList.contains('active'))loadPlayers()},10000);
</script></body></html>
