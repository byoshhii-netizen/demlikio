<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demlik</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #030107; font-family: 'Orbitron', sans-serif; user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #chatPanel, #namePanel { position: fixed; z-index: 10; color: #fff; background: rgba(10, 2, 28, .97); border: 2px solid #00ffff; box-shadow: 0 0 24px rgba(0, 229, 255, .35), inset 0 0 18px rgba(255, 0, 255, .12); font-family: 'Orbitron', sans-serif; user-select: text; }
        #chatPanel { right: 24px; bottom: 24px; width: min(390px, calc(100vw - 32px)); height: min(500px, calc(100vh - 48px)); display: none; grid-template-rows: auto 1fr auto; }
        #namePanel { left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); padding: 24px; display: none; text-align: center; }
        .chatHeader { padding: 14px 16px; border-bottom: 1px solid #6e2d9a; display: flex; justify-content: space-between; align-items: center; color: #00ffff; font-weight: 700; }
        .chatClose { cursor: pointer; color: #ff4f9a; font-size: 22px; }
        #chatMessages { overflow-y: auto; padding: 12px; user-select: text; }
        .chatMessage { margin-bottom: 11px; line-height: 1.35; word-break: break-word; }
        .chatMessage strong { color: #00ff66; font-size: 12px; }
        .chatMessage time { color: #77698c; font: 10px Arial, sans-serif; margin-left: 6px; }
        .chatMessage p { margin-top: 3px; color: #eee; font: 14px Arial, sans-serif; }
        #chatComposer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #6e2d9a; }
        #chatInput, #nameInput { min-width: 0; flex: 1; padding: 11px; color: #fff; background: #160727; border: 1px solid #8741ad; outline: none; font: 14px Arial, sans-serif; user-select: text; }
        #chatInput:focus, #nameInput:focus { border-color: #00ffff; box-shadow: 0 0 8px rgba(0, 255, 255, .35); }
        .chatButton { padding: 10px 13px; color: #00ffff; background: #120522; border: 1px solid #00ffff; cursor: pointer; font: 700 12px 'Orbitron', sans-serif; }
        .chatButton:hover { color: #fff; background: #241044; }
        #namePanel h2 { color: #00ffff; font-size: 20px; margin-bottom: 10px; }
        #namePanel p { color: #aaa; font: 13px Arial, sans-serif; margin-bottom: 16px; }
        #nameForm { display: flex; gap: 8px; }
        @media (max-width: 600px) { #chatPanel { right: 16px; bottom: 16px; height: min(460px, calc(100vh - 32px)); } }
    </style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<section id="chatPanel" aria-label="Sohbet">
    <header class="chatHeader"><span>DEMLİK // SOHBET</span><button class="chatClose" id="chatClose" aria-label="Sohbeti kapat">×</button></header>
    <div id="chatMessages"></div>
    <form id="chatComposer"><input id="chatInput" maxlength="240" autocomplete="off" placeholder="Mesajını yaz..."><button class="chatButton" type="submit">GÖNDER</button></form>
</section>
<section id="namePanel" aria-label="Görünen ad">
    <h2>SOHBETE KATIL</h2><p>Mesajlarda görünecek adını belirle. Daha sonra ayarlardan değiştirebilirsin.</p>
    <form id="nameForm"><input id="nameInput" maxlength="20" autocomplete="nickname" placeholder="Görünen ad"><button class="chatButton" type="submit">KAYDET</button></form>
</section>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- LOCAL STORAGE & KULLANICI YÖNETİMİ ---
function getSavedData(key, defaultValue) { const saved = localStorage.getItem(key); return saved !== null ? JSON.parse(saved) : defaultValue; }
function saveData(key, value) { localStorage.setItem(key, JSON.stringify(value)); }

let allUsers = getSavedData('dem_all_users', {});
let playerId = getSavedData('dem_player_id', null);
if (!playerId) {
    playerId = 'DEM-' + Math.random().toString(36).substr(2, 6).toUpperCase();
    saveData('dem_player_id', playerId);
}
if (!allUsers[playerId]) {
    allUsers[playerId] = { coins: 0, sugar: 0, bomb: 0, potion: 0, hasDiamond: false, diamondDurability: 100, highScore: 0, endlessRecord: 0 };
    saveData('dem_all_users', allUsers);
}

let r2ScoreThreshold = getSavedData('dem_r2_score', 36);
let r2TimeLimit = getSavedData('dem_r2_time', 90); 

let tutorialShown = getSavedData('dem_tutorial_shown', false);
let showTutorial = false;
let currentLang = getSavedData('dem_lang', 'TR');
let musicVolume = getSavedData('dem_music_volume', 0.5);
let sfxVolume = getSavedData('dem_sfx_volume', 0.5);
let isMuted = getSavedData('dem_muted', false);
let displayName = getSavedData('dem_display_name', '');
let onlineSessionId = null;
let onlineSyncTimer = null;
let chatOpen = false;
let chatNamePrompted = false;
let lastChatMessageId = 0;
function getOnlineProfile() { return allUsers[playerId] || {}; }
function onlineRequest(url, body, keepalive = false) {
    if (location.protocol === 'file:') return Promise.resolve(null);
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), keepalive }).catch(() => null);
}
function syncOnlinePlayer() {
    onlineRequest('/api/game/player', { playerId, displayName, profile: getOnlineProfile() });
}
function syncOnlineHeartbeat() {
    onlineRequest('/api/game/heartbeat', {
        playerId, displayName, profile: getOnlineProfile(), state: gameState, score: currentScore,
        level: difficultyLevel, isPlaying: gameState === 'PLAYING', sessionId: onlineSessionId
    });
}
function beginOnlineSession() {
    onlineSessionId = null;
    onlineRequest('/api/game/heartbeat', {
        playerId, displayName, profile: getOnlineProfile(), state: 'PLAYING', score: 0, level: 1, isPlaying: true
    }).then(response => response && response.json()).then(data => { if (data?.sessionId) onlineSessionId = data.sessionId; }).catch(() => {});
}
function syncUserData() {
    saveData('dem_all_users', allUsers);
    syncOnlinePlayer();
}
if (location.protocol !== 'file:') {
    syncOnlinePlayer();
    onlineSyncTimer = setInterval(syncOnlineHeartbeat, 10000);
    window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncOnlineHeartbeat(); loadChatMessages(); } });
    window.addEventListener('beforeunload', () => onlineRequest('/api/game/heartbeat', { playerId, displayName, profile: getOnlineProfile(), state: gameState, score: currentScore, level: difficultyLevel, isPlaying: false, sessionId: onlineSessionId }, true));
}

// --- HİLE DEĞİŞKENLERİ ---
let isInvincible = false;
let autoAimOn = false;
let autoAimTimer = 0;
let preCheatSugar = 0; // Şeker miktarını hafızada tutmak için

let infiniteDash = false;
let infiniteInventory = false;
let preCheatInventory = null;

// --- MÜZİK ---
const MENU_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784245915/m%C3%BCzik1_ll86tm.mp3";
const GAME_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784245915/m%C3%BCzik2_spltqg.mp3";
const GAME2_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784280718/Final_Stage_Fever_ganh0d.mp3"; 
const INVINCIBLE_MUSIC = "https://res.cloudinary.com/dahj5lxvv/video/upload/v1784280718/Final_Stage_Fever_ganh0d.mp3"; 

let bgAudio = new Audio(); bgAudio.loop = true; bgAudio.crossOrigin = "anonymous";
let audioCtx = null, currentMusicState = "MENU", isMusicLoaded = false, activeAudioSrc = "";

function initAudio() {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!isMusicLoaded) { bgAudio.src = MENU_MUSIC; bgAudio.load(); isMusicLoaded = true; }
    playMusicForState(currentMusicState);
}
function playMusicForState(state) {
    if (isMuted) { bgAudio.pause(); return; }
    let src = MENU_MUSIC;
    if (state === "GAME2") src = GAME2_MUSIC;
    else if (state === "GAME") src = GAME_MUSIC;
    else if (state === "INVINCIBLE") src = INVINCIBLE_MUSIC;

    if (activeAudioSrc !== src) { activeAudioSrc = src; bgAudio.src = src; bgAudio.load(); bgAudio.play().catch(()=>{}); } 
    else { if (bgAudio.paused) bgAudio.play().catch(()=>{}); }
    bgAudio.volume = musicVolume;
}
function toggleMute() { isMuted = !isMuted; saveData('dem_muted', isMuted); if (isMuted) bgAudio.pause(); else playMusicForState(currentMusicState); }
function setMusicVolume(val) { musicVolume = Math.max(0, Math.min(1, val)); saveData('dem_music_volume', musicVolume); if (!isMuted) bgAudio.volume = musicVolume; }
function setSfxVolume(val) { sfxVolume = Math.max(0, Math.min(1, val)); saveData('dem_sfx_volume', sfxVolume); }

function playSynthSFX(type) {
    if (!audioCtx) return; const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime, vol = sfxVolume;
    if (type === 'slash') { osc.type='triangle'; osc.frequency.setValueAtTime(600,now); osc.frequency.exponentialRampToValueAtTime(150,now+0.2); gain.gain.setValueAtTime(0.3*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.2); osc.start(now); osc.stop(now+0.2); }
    else if (type === 'hit') { osc.type='sine'; osc.frequency.setValueAtTime(1000,now); osc.frequency.exponentialRampToValueAtTime(300,now+0.12); gain.gain.setValueAtTime(0.4*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.12); osc.start(now); osc.stop(now+0.12); }
    else if (type === 'coin') { osc.type='square'; osc.frequency.setValueAtTime(880,now); osc.frequency.setValueAtTime(1200,now+0.08); gain.gain.setValueAtTime(0.15*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.25); osc.start(now); osc.stop(now+0.25); }
    else if (type === 'explosion') { osc.type='sawtooth'; osc.frequency.setValueAtTime(150,now); osc.frequency.exponentialRampToValueAtTime(10,now+0.6); gain.gain.setValueAtTime(0.6*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.6); osc.start(now); osc.stop(now+0.6); }
    else if (type === 'hurt') { osc.type='sawtooth'; osc.frequency.setValueAtTime(250,now); osc.frequency.linearRampToValueAtTime(50,now+0.35); gain.gain.setValueAtTime(0.4*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.35); osc.start(now); osc.stop(now+0.35); }
    else if (type === 'shoot') { osc.type='square'; osc.frequency.setValueAtTime(800,now); osc.frequency.exponentialRampToValueAtTime(400,now+0.1); gain.gain.setValueAtTime(0.2*vol,now); gain.gain.exponentialRampToValueAtTime(0.01,now+0.1); osc.start(now); osc.stop(now+0.1); }
}

let gameState = "MENU";
let isSettingsOpen = false, showDevModal = false, shopOpenFromMenu = false, showInGameSettings = false;
const chatPanel = document.getElementById('chatPanel');
const chatMessagesElement = document.getElementById('chatMessages');
const chatInput = document.getElementById('chatInput');
const namePanel = document.getElementById('namePanel');
const nameInput = document.getElementById('nameInput');
function renderChatMessages(messages) {
    messages.forEach(message => {
        if (message.id <= lastChatMessageId) return;
        lastChatMessageId = message.id;
        const row = document.createElement('article'); row.className = 'chatMessage';
        const author = document.createElement('strong'); author.textContent = message.display_name || message.player_id;
        const time = document.createElement('time'); time.textContent = new Date(message.created_at).toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
        const text = document.createElement('p'); text.textContent = message.message;
        row.append(author, time, text); chatMessagesElement.appendChild(row);
    });
    while (chatMessagesElement.children.length > 100) chatMessagesElement.firstElementChild.remove();
    chatMessagesElement.scrollTop = chatMessagesElement.scrollHeight;
}
function loadChatMessages() {
    if (location.protocol === 'file:') return;
    fetch(`/api/game/chat?after=${lastChatMessageId}`).then(response => response.ok ? response.json() : null).then(data => { if (data) renderChatMessages(data.messages); }).catch(() => {});
}
function saveDisplayName(event) {
    event.preventDefault();
    const nextName = nameInput.value.trim().replace(/\s+/g, ' ').slice(0, 20);
    if (!nextName) return;
    displayName = nextName; saveData('dem_display_name', displayName); syncOnlinePlayer();
    namePanel.style.display = 'none';
    if (chatNamePrompted) { chatNamePrompted = false; openChat(); }
}
function openChat() {
    if (!displayName) { chatNamePrompted = true; nameInput.value = ''; namePanel.style.display = 'block'; nameInput.focus(); return; }
    chatOpen = true; chatPanel.style.display = 'grid'; loadChatMessages(); chatInput.focus();
}
function closeChat() { chatOpen = false; chatPanel.style.display = 'none'; namePanel.style.display = 'none'; }
function toggleChat() { if (chatOpen) closeChat(); else openChat(); }
document.getElementById('chatClose').addEventListener('click', closeChat);
document.getElementById('nameForm').addEventListener('submit', saveDisplayName);
document.getElementById('chatComposer').addEventListener('submit', event => {
    event.preventDefault(); const message = chatInput.value.trim(); if (!message || location.protocol === 'file:') return;
    chatInput.value = '';
    fetch('/api/game/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playerId, displayName, message }) }).then(response => response.ok ? response.json() : null).then(data => { if (data?.message) renderChatMessages([data.message]); }).catch(() => {});
});
setInterval(loadChatMessages, 4000);
let survivalTimer = 0, endlessTimer = 0;
let gameOverDelay = 0;
let damageFeedbackTimer = 0;
let activeKeys = new Set();
const inputMap = { left: false, right: false, dash: false, down: false };
let selectedSlot = 0, currentScore = 0, mouseX = 0, mouseY = 0;
let difficultyLevel = 1;
let randomMessageTimer = 0, randomMessageText = "", randomMessageDisplay = 0;
const randomMessages = ["iso yaptı bu oyunu", "çay sevmeyen poh içsin", "CMS Team adamdır", "Oshi bir dahi", "İsocuk yaptı", "selam isocuk"];

let potionActive = false, potionTimer = 0, potionBonusHp = 0, potionBonusDamage = 0;
let adminPassInput = "", adminSelectedUserIndex = 0, adminUsersKeys = [];

const shopData = [ 
    { id: 'bomb', name: '3x Patlayıcı', cost: 15 }, 
    { id: 'diamond', name: 'Elmas Katana', cost: 100 }, 
    { id: 'potion', name: 'Bergamot', cost: 30 }, 
    { id: 'sugar', name: '5x Şeker', cost: 10 } 
];
let currentShopHitboxes = []; 

const inventoryItems = [
    { id: 'normal', name: 'Katana', count: 1 }, 
    { id: 'bomb', name: 'Patlayıcı', count: () => allUsers[playerId]?.bomb || 0 }, 
    { id: 'diamond', name: 'Elmas', count: () => allUsers[playerId]?.hasDiamond ? 1 : 0 }, 
    { id: 'potion', name: 'Bergamot', count: () => allUsers[playerId]?.potion || 0 }, 
    { id: 'sugar', name: 'Şeker', count: () => allUsers[playerId]?.sugar || 0 }
];

const uiButtons = { 
    menuPlay: {x:0,y:0,w:280,h:50}, menuShop: {x:0,y:0,w:280,h:50}, menuSettings: {x:0,y:0,w:280,h:50}, menuDev: {x:0,y:0,w:280,h:50}, 
    volumeBar: {x:0,y:0,w:200,h:10}, sfxBar: {x:0,y:0,w:200,h:10}, closeBtn: {x:0,y:0,w:140,h:40}, 
    gameCart: {x:0,y:0,w:60,h:42}, pauseResume: {x:0,y:0,w:220,h:45}, pauseMute: {x:0,y:0,w:220,h:45}, 
    pauseSettings: {x:0,y:0,w:220,h:45}, pauseMenu: {x:0,y:0,w:220,h:45}, 
    tutorialClose: {x:0,y:0,w:180,h:46}, helpBtn: {x:0,y:0,w:44,h:44} 
};
let adminBtns = [];
const locale = {
    TR: { title: "Demlik", play: "OYUNA BAŞLA", shop: "MARKET", settings: "AYARLAR", dev: "GELİŞTİRİCİLER", 
          close: "KAPAT", paused: "OYUN DURDURULDU", resume: "DEVAM ET", mainMenu: "ANA MENÜ", 
          highscore: "REKOR", endless: "SONSUZLUK", coin: "PARA", level: "SEVİYE", score: "SKOR", 
          target: "HEDEF", time: "SÜRE", music: "MÜZİK", sfx: "SES EFECTI", lang: "DİL",
          shopTitleMenu: "KARABORSAYA HOŞGELDİN", shopTitleGame: "HIZLI SATIN ALIM" },
    EN: { title: "Demlik", play: "START GAME", shop: "SHOP", settings: "SETTINGS", dev: "DEVELOPERS",
          close: "CLOSE", paused: "GAME PAUSED", resume: "RESUME", mainMenu: "MAIN MENU",
          highscore: "RECORD", endless: "ENDLESS", coin: "COINS", level: "LEVEL", score: "SCORE",
          target: "TARGET", time: "TIME", music: "MUSIC", sfx: "SFX", lang: "LANG",
          shopTitleMenu: "WELCOME TO BLACK MARKET", shopTitleGame: "QUICK BUY" }
};
let gameContent = null;
function applyGameContent(content) {
    if (!content) return;
    gameContent = content;
    if (content.locale?.TR) Object.assign(locale.TR, content.locale.TR);
    if (content.locale?.EN) Object.assign(locale.EN, content.locale.EN);
    if (Array.isArray(content.randomMessages) && content.randomMessages.length) { randomMessages.splice(0, randomMessages.length, ...content.randomMessages); }
    if (content.shopNames) shopData.forEach(item => { if (content.shopNames[item.id]) item.name = content.shopNames[item.id]; });
}
if (location.protocol !== 'file:') fetch('/api/game/content').then(response => response.ok ? response.json() : null).then(applyGameContent).catch(() => {});

window.addEventListener('keydown', (e) => {
    initAudio();
    
    if (gameState === "CHEAT_PANEL") {
        if (e.key === "Enter") {
            let cu = allUsers[playerId];
            if (cheatCodeInput === "ParamıVerLaKahveci") { cu.coins += 999999999; playSynthSFX('coin'); }
            else if (cheatCodeInput === "ParamıAlLaKahveci") { cu.coins = 0; playSynthSFX('hurt'); }
            else if (cheatCodeInput === "SkorArtsanaAq") { currentScore += 50; playSynthSFX('coin'); }
            else if (cheatCodeInput === "Skorbitamk") { currentScore = 0; playSynthSFX('hurt'); }
            else if (cheatCodeInput === "PayımıYedilerAmk") { isInvincible = true; playMusicForState("INVINCIBLE"); playSynthSFX('coin'); }
            else if (cheatCodeInput === "PayımıYemeLa") { isInvincible = false; demlik.hp = demlik.maxHp; playMusicForState(currentMusicState); playSynthSFX('hurt'); }
            else if (cheatCodeInput === "OtoVurOn") { preCheatSugar = cu.sugar; autoAimOn = true; cu.sugar = 9999; playSynthSFX('coin'); }
            else if (cheatCodeInput === "OtoVurOff") { autoAimOn = false; cu.sugar = preCheatSugar; playSynthSFX('hurt'); }
            else if (cheatCodeInput === "HeyDash") { infiniteDash = true; playSynthSFX('coin'); }
            else if (cheatCodeInput === "OffDash") { infiniteDash = false; playSynthSFX('hurt'); }
            else if (cheatCodeInput === "HeyEnvanter") { 
                if (!infiniteInventory) {
                    preCheatInventory = { bomb: cu.bomb, sugar: cu.sugar, potion: cu.potion, hasDiamond: cu.hasDiamond, diamondDurability: cu.diamondDurability };
                    infiniteInventory = true;
                }
                playSynthSFX('coin'); 
            }
            else if (cheatCodeInput === "OffEnvanter") { 
                if (infiniteInventory && preCheatInventory) {
                    cu.bomb = preCheatInventory.bomb; cu.sugar = preCheatInventory.sugar; cu.potion = preCheatInventory.potion;
                    cu.hasDiamond = preCheatInventory.hasDiamond; cu.diamondDurability = preCheatInventory.diamondDurability;
                    infiniteInventory = false; preCheatInventory = null;
                }
                playSynthSFX('hurt'); 
            }
            syncUserData();
            gameState = window._prevState || "MENU"; window._prevState = null;
        } else if (e.key === "Escape") {
            gameState = window._prevState || "MENU"; window._prevState = null;
        } else if (e.key === "Backspace") {
            cheatCodeInput = cheatCodeInput.slice(0, -1);
        } else if (e.key.length === 1) { 
            cheatCodeInput += e.key;
        }
        return;
    }

    let key = e.key.toLowerCase();
    if (key === 'c' && e.target !== chatInput && e.target !== nameInput) { toggleChat(); e.preventDefault(); return; }
    if (chatOpen && e.target === chatInput) return;
    
    if (gameState === "ADMIN_LOGIN") {
        if (e.key === "Enter") {
            if (adminPassInput === "1121") {
                gameState = "ADMIN_PANEL"; adminUsersKeys = Object.keys(allUsers); 
                adminSelectedUserIndex = adminUsersKeys.indexOf(playerId);
                if (adminSelectedUserIndex === -1) adminSelectedUserIndex = 0;
                playSynthSFX('coin');
            } else { gameState = "MENU"; playSynthSFX('hurt'); }
        } else if (e.key === "Escape") { gameState = "MENU"; }
        else if (e.key === "Backspace") { adminPassInput = adminPassInput.slice(0, -1); }
        else if (key.length === 1 && /[0-9]/.test(key)) { adminPassInput += key; }
        return;
    }

    activeKeys.add(key); updateInputs();
    
    if (gameState === "PLAYING" && (key === 'w' || key === ' ' || key === 'arrowup')) {
        if (demlik.grounded) {
            demlik.vy = demlik.jumpForce; demlik.grounded = false; demlik.canDoubleJump = true; playSynthSFX('slash');
        } else if (demlik.canDoubleJump) {
            demlik.vy = demlik.jumpForce; demlik.canDoubleJump = false; playSynthSFX('slash');
            spawnParticles(demlik.x + demlik.width/2, demlik.y + demlik.height, '#00ffff', 15, 1.5);
        }
    }

    if (e.key === 'Escape') {
        if (gameState === "PLAYING") { gameState = "PAUSED"; showInGameSettings = false; } 
        else if (gameState === "PAUSED") { if (showInGameSettings) showInGameSettings = false; else gameState = "PLAYING"; } 
        else if (gameState === "IN_GAME_SHOP") { gameState = "PLAYING"; shopOpenFromMenu = false; } 
        else if (gameState === "MENU_SHOP") { gameState = "MENU"; shopOpenFromMenu = false; } 
        else if (gameState === "MENU") { isSettingsOpen = false; shopOpenFromMenu = false; showDevModal = false; }
        else if (gameState === "ADMIN_PANEL") { gameState = "MENU"; syncUserData(); }
    }
    if (e.key === 'Enter' || key === ' ') {
        if (gameState === "MENU" && !isSettingsOpen && !shopOpenFromMenu && !showDevModal) startSurvivalGame();
        else if (gameState === "GAMEOVER" || gameState === "GAMEOVER_SCORE") { 
            if (gameOverDelay <= 0) { gameState = "MENU"; }
        }
    }
    if (['1','2','3','4','5'].includes(e.key)) selectedSlot = parseInt(e.key)-1;
    if (key === 'q') { if (gameState === "PLAYING") { demlik.facing = -1; useSelectedItem(); } }
    if (key === 'e') { if (gameState === "PLAYING") { demlik.facing = 1; useSelectedItem(); } }
    
    if (key === 'm') {
        if (gameState === "PLAYING") { gameState = "IN_GAME_SHOP"; shopOpenFromMenu = true; playSynthSFX('hit'); }

function handleShopClick(mx, my) {

let playerProjectiles = [];

}

const demlik = {
    x:100, y:400, width:60, height:48, vx:0, vy:0, speed:6.2, jumpForce:-13.5, grounded:false, canDoubleJump:false, facing:1, hp:3, maxHp:3, damagePower:1, iframe:0, isSlashing:false, slashTimer:0, slashRange:140, isDashing:false, dashTimer:0, dashCooldown:0, ghosts:[], scaleRatio:1, dashStamina:2, dashStaminaMax:2, dashRegenTimer:0,

        ctx.save(); ctx.translate(-camera.x + this.x, -camera.y + this.y); let s = this.scaleRatio; ctx.scale(s, s);

            ctx.lineTo(0,0);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 15 * (1-p) / s;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            let edgeAngle = -Math.PI/2 + p * Math.PI*1.1;
            ctx.lineTo(Math.cos(edgeAngle) * this.slashRange/s, Math.sin(edgeAngle) * this.slashRange/s);
            ctx.stroke();
            ctx.restore();
        }

        ctx.shadowBlur = 15; ctx.shadowColor = '#00ffff'; ctx.fillStyle = '#eceff1'; ctx.fillRect(11, 11, 38, 37); ctx.fillStyle = '#00ffff'; ctx.fillRect(8, 5, 44, 6); ctx.fillRect(25, 0, 10, 5);
        if (this.facing === 1) { ctx.fillRect(49, 16, 11, 11); ctx.fillRect(0, 13, 11, 27); } else { ctx.fillRect(0, 16, 11, 11); ctx.fillRect(49, 13, 11, 27); } ctx.shadowBlur = 0;
        if (Math.random() < 0.2) { let steamX = this.facing === 1 ? this.x + 52*s : this.x + 6*s; particles.push({ x:steamX, y:this.y + 11*s, vx:this.facing*0.4, vy:-Math.random()*1.2-0.4, radius:Math.random()*3+1, color:'rgba(0,255,255,0.4)', alpha:0.5, decay:0.015, gravityY:-0.04 }); }
        
        ctx.restore();
    },
    update() {
        if (this.iframe > 0) this.iframe--; if (this.dashCooldown > 0) this.dashCooldown--;
        if (this.dashStamina < this.dashStaminaMax) { this.dashRegenTimer++; if (this.dashRegenTimer >= 150) { this.dashStamina = Math.min(this.dashStaminaMax, this.dashStamina + 1); this.dashRegenTimer = 0; } } else { this.dashRegenTimer = 0; }
        this.ghosts.forEach(g => g.alpha -= 0.08); this.ghosts = this.ghosts.filter(g => g.alpha > 0);
        if (inputMap.down && this.grounded) { let onPlatform = false; for (let p of platforms) { if (!p.isFloor && this.x + this.width > p.x && this.x < p.x + p.width && Math.abs((this.y + this.height) - p.y) < 5) { onPlatform = true; break; } } if (onPlatform) { this.y += 5; this.grounded = false; this.vy = 2; } }
        if (this.isDashing) { this.vx = this.facing * 19; this.vy = 0; this.dashTimer--; if (this.dashTimer % 2 === 0) this.ghosts.push({ x:this.x, y:this.y, alpha:0.5 }); if (this.dashTimer <= 0) this.isDashing = false; }

let platforms = [];
function generateArena(level) {
    platforms = []; const floorY = canvas.height - 120;
    let arenaWidth = level === 1 ? 2400 : 4000;
    platforms.push({ x: 0, y: floorY, width: arenaWidth, height: 40, isFloor: true });
    const layer1Y = floorY - 130, layer2Y = floorY - 260, layer3Y = floorY - 390;
    let currX = 200;
    while(currX < arenaWidth - 250) {
        let pw = 150 + Math.random() * 200;
        let pY = Math.random() < 0.4 ? layer1Y : (Math.random() < 0.7 ? layer2Y : layer3Y);
        platforms.push({ x: currX, y: pY, width: pw, height: 16, isFloor: false });
        currX += pw + 200 + Math.random() * 300;
    }
}

let enemies = [];
class Enemy {
    constructor(x, y, type, level) {

        this.maxHp = Math.floor((type === 'cola' ? 8 : (type === 'coffee' ? 5 : 4)) * (1 + (level-1) * 0.3));
        this.hp = this.maxHp;

    }
    draw() {

        ctx.fillStyle = '#110221'; ctx.fillRect(barX, barY, barW, barH); ctx.fillStyle = '#ff1744'; ctx.fillRect(barX, barY, barW * (this.hp / this.maxHp), barH); ctx.shadowBlur = 10;
        if (this.type === 'coffee') { ctx.shadowColor = '#6d4c41'; ctx.fillStyle = '#8d6e63'; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.fillStyle = '#ffffff'; ctx.fillRect(this.x - 2, this.y - 4, this.width + 4, 6); }
        else if (this.type === 'cola') { ctx.shadowColor = '#f44336'; ctx.fillStyle = '#e53935'; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.fillStyle = '#b0bec5'; ctx.fillRect(this.x + 4, this.y - 4, this.width - 8, 4); }
        else if (this.type === 'hamburger') { ctx.shadowColor = '#ffb300'; ctx.fillStyle = '#ffe082'; ctx.fillRect(this.x, this.y, this.width, 12); ctx.fillStyle = '#4e342e'; ctx.fillRect(this.x - 2, this.y + 12, this.width + 4, 10); ctx.fillStyle = '#ffe082'; ctx.fillRect(this.x, this.y + 22, this.width, 12); }
        else if (this.type === 'shooter') { ctx.shadowColor = '#00ff66'; ctx.fillStyle = '#024218'; ctx.fillRect(this.x, this.y, this.width, this.height); ctx.fillStyle = '#00ff66'; ctx.fillRect(this.x - 2, this.y - 4, this.width + 4, 6); }

            if (this.direction === 1) { let startAng = -Math.PI / 2 + progress * Math.PI * 0.4; let endAng = startAng + Math.PI * 0.6; ctx.arc(this.x + this.width, this.y + this.height / 2, this.slashRange, startAng, endAng); } 
            else { let startAng = Math.PI * 1.5 - progress * Math.PI * 0.4; let endAng = startAng - Math.PI * 0.6; ctx.arc(this.x, this.y + this.height / 2, this.slashRange, startAng, endAng, true); }
            ctx.stroke();
        }

    }
    update() {

        let dx = (demlik.x + demlik.width / 2) - (this.x + this.width / 2), dy = (demlik.y + demlik.height / 2) - (this.y + this.height / 2), dist = Math.sqrt(dx*dx + dy*dy);
        if (this.type === 'shooter') {

            if (Math.abs(this.direction) > 0) this.x += this.direction * this.speed;

            if (dist < 450 && (Math.abs(dx) > 50 && !this.isSlashing)) { this.x += this.direction * this.speed; }
        }
        this.grounded = false;
        for (let p of platforms) { if (this.x + this.width > p.x && this.x < p.x + p.width && this.y + this.height >= p.y && this.y + this.height - this.vy <= p.y + 12) { this.y = p.y - this.height; this.vy = 0; this.grounded = true; } }
        let arenaWidth = difficultyLevel === 1 ? 2400 : 4000;

            let color = '#6d4c41'; if (this.type === 'hamburger') color = '#ffb300'; if (this.type === 'cola') color = '#e53935'; if (this.type === 'shooter') color = '#00ff66';
            spawnParticles(this.x + this.width / 2, this.y + this.height / 2, color, 20, 2);
        } else {
            let color = '#6d4c41'; if (this.type === 'hamburger') color = '#ffb300'; if (this.type === 'cola') color = '#e53935'; if (this.type === 'shooter') color = '#00ff66';
            spawnParticles(this.x + this.width / 2, this.y + this.height / 2, color, 8, 1.5);
        }
    }
}
function manageSpawning() {

let camera = { x:0, y:0, targetX:0, shakeTimer:0, shakeIntensity:0 }, hitstopTimer = 0; const gravity = 0.55;

// --- GÜNCELLEME ---
function update() {
    if (gameState === "PLAYING") {
        if (hitstopTimer > 0) { hitstopTimer--; return; } 

        // OTO-VUR HİLESİ MANTIĞI
        if (autoAimOn) {
            allUsers[playerId].sugar = 9999;
            autoAimTimer++;
            if (autoAimTimer >= 10) { 
                autoAimTimer = 0;
                let target = enemies.find(e => e.alive);
                if (target) {
                    target.takeDamage(999);
                    spawnParticles(target.x + target.width/2, target.y + target.height/2, '#ffffff', 15, 2);
                    playSynthSFX('shoot');
                }
            }
        }

        if (difficultyLevel === 1) {
            if (r2TimeLimit > 0) { survivalTimer--; if (survivalTimer <= 0) { if (currentScore >= r2ScoreThreshold) advanceLevel(); else { gameState = "GAMEOVER_SCORE"; gameOverDelay = 10; } } } 
            else { if (currentScore >= r2ScoreThreshold) advanceLevel(); }
        } else { if (Math.floor(Date.now() / 1000) > endlessTimer) { endlessTimer++; if (endlessTimer > allUsers[playerId].endlessRecord) { allUsers[playerId].endlessRecord = endlessTimer; syncUserData(); } } }
        
        if (randomMessageTimer > 0) { randomMessageTimer--; } else { randomMessageText = randomMessages[Math.floor(Math.random() * randomMessages.length)]; randomMessageDisplay = 120; randomMessageTimer = 300 + Math.floor(Math.random() * 600); }
        if (randomMessageDisplay > 0) { randomMessageDisplay--; }
        if (potionActive) { potionTimer--; if (potionTimer <= 0) { demlik.maxHp -= potionBonusHp; demlik.hp = Math.min(demlik.hp, demlik.maxHp); demlik.damagePower -= potionBonusDamage; potionActive = false; potionBonusHp = 0; potionBonusDamage = 0; demlik.scaleRatio = 1; demlik.width = 60; demlik.height = 48; demlik.slashRange = 140; spawnParticles(demlik.x+demlik.width/2, demlik.y+demlik.height/2, '#ff6600', 15, 1.2); } }
        if (damageFeedbackTimer > 0) damageFeedbackTimer--;

        demlik.update(); enemies.forEach(enemy => enemy.update()); coins.forEach(coin => coin.update()); coins = coins.filter(c => !c.collected);
        playerProjectiles.forEach(p => p.update()); playerProjectiles = playerProjectiles.filter(p => p.active);
        enemyProjectiles.forEach(p => p.update()); enemyProjectiles = enemyProjectiles.filter(p => p.active);
        updateAndDrawBombs(); manageSpawning();
        
        demlik.grounded = false;
        platforms.forEach(p => { if (inputMap.down && !p.isFloor) return; if (demlik.x+demlik.width > p.x && demlik.x < p.x+p.width && demlik.y+demlik.height >= p.y && demlik.y+demlik.height-demlik.vy <= p.y+12) { demlik.y = p.y - demlik.height; demlik.vy = 0; demlik.grounded = true; demlik.canDoubleJump = true; } });
        for (let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += p.gravityY; p.alpha -= p.decay; if (p.alpha <= 0) particles.splice(i,1); }
        
        camera.targetX = demlik.x - canvas.width/2;
        let aw = difficultyLevel === 1 ? 2400 : 4000;
        camera.targetX = Math.max(0, Math.min(Math.max(0, aw - canvas.width), camera.targetX)); 
        camera.x += (camera.targetX - camera.x) * 0.08;
        if (camera.shakeTimer > 0) { camera.x += (Math.random()-0.5)*camera.shakeIntensity; camera.shakeTimer--; }
    } else if (gameState === "GAMEOVER" || gameState === "GAMEOVER_SCORE") {
        if (gameOverDelay > 0) gameOverDelay--;
    }
}

        ctx.fillStyle='#ffd700'; ctx.font='bold 22px "Orbitron"'; ctx.textAlign='center'; ctx.fillText(`${L.coin}: ${cu.coins}`, canvas.width/2, 46);

        ctx.fillStyle='rgba(11,4,25,0.9)'; ctx.strokeStyle=theme.pStroke; ctx.lineWidth=2;

            const sx=invX+22+index*(slotSize+slotGap), sy=invY+8; let countVal = typeof item.count === 'function' ? item.count() : item.count; let usable = true;
            if (item.id === 'bomb') usable = (countVal > 0 || isInvincible || infiniteInventory); 
            else if (item.id === 'diamond') usable = ((cu.hasDiamond && cu.diamondDurability > 0) || isInvincible || infiniteInventory); 
            else if (item.id === 'potion') usable = ((countVal > 0 || isInvincible || infiniteInventory) && !potionActive); 
            else if (item.id === 'sugar') usable = (countVal > 0 || isInvincible || infiniteInventory);

            else if (item.id==='potion') drawPixelPotion(sx+32, sy+32);

                ctx.fillStyle='#ff1744'; ctx.fillRect(sx+5, sy+slotSize-6, slotSize-10, 3);
                ctx.fillStyle='#00ffff'; ctx.fillRect(sx+5, sy+slotSize-6, (slotSize-10)*(cu.diamondDurability/100), 3);
            }
            if (!usable && item.id!=='normal') { ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(sx+8, sy+8); ctx.lineTo(sx+slotSize-8, sy+slotSize-8); ctx.moveTo(sx+slotSize-8, sy+8); ctx.lineTo(sx+8, sy+slotSize-8); ctx.stroke(); }
        });

        if (damageFeedbackTimer > 0) {
            ctx.save();
            ctx.globalAlpha = damageFeedbackTimer / 60;
            ctx.fillStyle = '#ff1744';
            ctx.font = 'bold 48px "Orbitron"';
            ctx.textAlign = 'center';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#ff1744';
            ctx.fillText("-1 ♥", canvas.width/2, canvas.height/2 - (60 - damageFeedbackTimer));
            ctx.restore();
        }

        if (gameState === "PAUSED") { drawPauseMenu(L); }
        if (gameState === "IN_GAME_SHOP") drawInGameShop(L, cu);
        if (showTutorial) drawTutorialModal(L);
    } else if (gameState === "GAMEOVER" || gameState === "GAMEOVER_SCORE") {
        ctx.fillStyle='#000000'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#ff1744'; ctx.font='bold 44px "Orbitron"'; ctx.textAlign='center';

}

        uiButtons.pauseMenu = { x:(canvas.width-btnW)/2, y:startBtnY+3*(btnH+btnGap), w:btnW, h:btnH }; drawMenuButton(uiButtons.pauseMenu, L.mainMenu, mxIn(uiButtons.pauseMenu), '#ff0055', '#880022');
    }
}

function drawAdminPanel(L) {
    ctx.fillStyle = '#050110'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.strokeStyle = '#00ffff'; ctx.lineWidth=4; ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);
    const pw = 700, ph = 540, px = (canvas.width-pw)/2, py = (canvas.height-ph)/2;
    ctx.fillStyle = '#100520'; ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = 3; ctx.shadowBlur = 25; ctx.shadowColor = '#ff00ff'; ctx.fillRect(px,py,pw,ph); ctx.strokeRect(px,py,pw,ph); ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px "Orbitron"'; ctx.textAlign = 'center'; ctx.fillText('KULLANICI YÖNETİMİ', canvas.width/2, py+40);
    
    if (adminUsersKeys.length === 0) { ctx.fillStyle='#ffaa00'; ctx.font='18px "Orbitron"'; ctx.fillText('Henüz kullanıcı yok.', canvas.width/2, py+150); return; }
    let selectedId = adminUsersKeys[adminSelectedUserIndex]; let selectedData = allUsers[selectedId];
    if (!selectedData) { adminUsersKeys = Object.keys(allUsers); if(adminUsersKeys.length>0){adminSelectedUserIndex=0; selectedId=adminUsersKeys[0]; selectedData=allUsers[selectedId];} else return; }

    let arrW=40, arrH=30, arrY=py+75;
    uiButtons.prevUser = { x: px+40, y:arrY-20, w:arrW, h:arrH }; drawMenuButton(uiButtons.prevUser, "<", mxIn(uiButtons.prevUser), '#00ffff', '#007f7f');
    uiButtons.nextUser = { x: px+pw-80, y:arrY-20, w:arrW, h:arrH }; drawMenuButton(uiButtons.nextUser, ">", mxIn(uiButtons.nextUser), '#00ffff', '#007f7f');
    ctx.fillStyle = '#00ffff'; ctx.font = 'bold 18px "Orbitron"'; ctx.textAlign = 'center'; ctx.fillText(`${selectedId}  (${adminSelectedUserIndex+1}/${adminUsersKeys.length})`, canvas.width/2, arrY);
    if(selectedId === playerId) { ctx.fillStyle = '#00ff66'; ctx.font = '14px "Orbitron"'; ctx.fillText("(SEN)", canvas.width/2, arrY+24); }
    
    adminBtns = []; ctx.textAlign = 'left'; ctx.font = '16px Arial, sans-serif';
    const createRow = (label, value, actionMinus, actionPlus, yOff) => {
        ctx.fillStyle = '#cccccc'; ctx.fillText(label, px+50, py+yOff); ctx.fillStyle = '#ffd700'; ctx.fillText(value, px+370, py+yOff);
        let bM = { x:px+480, y:py+yOff-18, w:40, h:28, action: actionMinus }; 
        let bP = { x:px+530, y:py+yOff-18, w:40, h:28, action: actionPlus };
        ctx.fillStyle='#880022'; ctx.fillRect(bM.x, bM.y, bM.w, bM.h); ctx.fillStyle='#007f3f'; ctx.fillRect(bP.x, bP.y, bP.w, bP.h);
        ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.fillText('-', bM.x+20, bM.y+19); ctx.fillText('+', bP.x+20, bP.y+19); ctx.textAlign='left';
        adminBtns.push(bM, bP);
    };
    createRow("Coin:", selectedData.coins, 'coin-', 'coin+', 135);
    createRow("Şeker (Slot5):", selectedData.sugar, 'sug-', 'sug+', 175);
    createRow("Rekor Skoru:", selectedData.highScore, 'hs-', 'hs+', 215);
    createRow("Süre Rekoru:", selectedData.endlessRecord, 'er-', 'er+', 255);
    
    ctx.fillStyle = '#ff00ff'; ctx.font = 'bold 18px "Orbitron"'; ctx.fillText("-- GENEL AYARLAR --", px+50, py+320);
    ctx.font = '16px Arial, sans-serif';
    createRow("2. Tur Skor Barajı:", r2ScoreThreshold, 'r2sc-', 'r2sc+', 360);
    createRow("Süre (0=süresiz):", r2TimeLimit === 0 ? "∞" : r2TimeLimit + " sn", 'r2tm-', 'r2tm+', 400);
    ctx.fillStyle = '#ffaa00'; ctx.font = '12px Arial, sans-serif'; ctx.fillText("*Süreyi 0 yaparsanız baraja ulaşınca direkt 2. tura geçer.", px+50, py+440);
    let cW=140,cH=40,cX=(canvas.width-cW)/2,cY=py+ph-60; uiButtons.closeBtn = { x:cX, y:cY, w:cW, h:cH }; drawMenuButton(uiButtons.closeBtn, L.close, mxIn(uiButtons.closeBtn), '#ff0055', '#880022');
}

    ctx.fillStyle = '#100520'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.shadowBlur = 25; ctx.shadowColor = '#00ffff'; ctx.fillRect(px,py,pw,ph); ctx.strokeRect(px,py,pw,ph); ctx.shadowBlur = 0;

    ctx.font = '16px "Orbitron"'; ctx.textAlign = 'left';
    const drawKey = (x, y, text, width=40) => { ctx.strokeStyle='#00ffff'; ctx.lineWidth=2; ctx.strokeRect(x,y,width,30); ctx.fillStyle='#110221'; ctx.fillRect(x,y,width,30); ctx.fillStyle='#ffffff'; ctx.textAlign='center'; ctx.fillText(text, x+width/2, y+20); ctx.textAlign='left'; };

    ctx.fillStyle = '#00ff66'; ctx.fillText('SAVAŞ:', px+40, py+160); drawKey(px+140, py+138, 'Q'); ctx.fillStyle = '#cccccc'; ctx.fillText('Sola Vur / Eşya Kullan', px+190, py+160); drawKey(px+140, py+178, 'E'); ctx.fillStyle = '#cccccc'; ctx.fillText('Sağa Vur / Eşya Kullan', px+190, py+200);
    ctx.fillStyle = '#00ff66'; ctx.fillText('AKROBASİ:', px+40, py+250); drawKey(px+150, py+228, 'W', 40); drawKey(px+200, py+228, 'SPACE', 80); ctx.fillStyle = '#cccccc'; ctx.fillText('Zıplama / Çift Zıplama', px+290, py+250); drawKey(px+150, py+268, 'SHIFT', 70); ctx.fillStyle = '#cccccc'; ctx.fillText('Dash (Dayanıklılık Harcar)', px+230, py+290); drawKey(px+150, py+308, 'S'); ctx.fillStyle = '#cccccc'; ctx.fillText('Platformdan İn', px+200, py+330);
    ctx.fillStyle = '#00ff66'; ctx.fillText('DİĞER:', px+40, py+380); drawKey(px+120, py+358, '1-5', 50); ctx.fillStyle = '#cccccc'; ctx.fillText('Eşya Seçimi', px+180, py+380); drawKey(px+120, py+398, 'M'); ctx.fillStyle = '#cccccc'; ctx.fillText('Market (Oyun içi açılabilir)', px+170, py+420);

function drawSettingsUI(L) {
    ctx.fillStyle = 'rgba(10,3,22,0.95)'; ctx.strokeStyle='#00ffff'; ctx.lineWidth=3; ctx.shadowBlur=20; ctx.shadowColor='#00ffff'; 
    const panelW=420, panelH=480, panelX=(canvas.width-panelW)/2, panelY=(canvas.height-panelH)/2; 
    ctx.fillRect(panelX,panelY,panelW,panelH); ctx.strokeRect(panelX,panelY,panelW,panelH); ctx.shadowBlur=0;
    ctx.fillStyle='#ffffff'; ctx.font='bold 24px "Orbitron"'; ctx.textAlign='center'; ctx.fillText(L.settings, canvas.width/2, panelY+45); 
    ctx.fillStyle='#00ff66'; ctx.font='14px "Orbitron"'; ctx.fillText(`ID: ${playerId}`, canvas.width/2, panelY+85); 
    ctx.fillStyle='#888888'; ctx.font='16px "Orbitron"'; ctx.fillText(L.music, canvas.width/2, panelY+135);
    let barW=200, barH=10, barX=(canvas.width-barW)/2, barY=panelY+155; uiButtons.volumeBar = { x:barX, y:barY, w:barW, h:barH }; 
    ctx.fillStyle='#331155'; ctx.fillRect(barX,barY,barW,barH); ctx.fillStyle='#00ffff'; ctx.fillRect(barX,barY,barW*musicVolume,barH); ctx.beginPath(); ctx.arc(barX+barW*musicVolume, barY+barH/2, 11, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#888888'; ctx.font='16px "Orbitron"'; ctx.fillText(L.sfx, canvas.width/2, panelY+205); 
    let sbarW=200, sbarH=10, sbarX=(canvas.width-sbarW)/2, sbarY=panelY+225; uiButtons.sfxBar = { x:sbarX, y:sbarY, w:sbarW, h:sbarH }; 
    ctx.fillStyle='#331155'; ctx.fillRect(sbarX,sbarY,sbarW,sbarH); ctx.fillStyle='#ff00ff'; ctx.fillRect(sbarX,sbarY,sbarW*sfxVolume,sbarH); ctx.beginPath(); ctx.arc(sbarX+sbarW*sfxVolume, sbarY+sbarH/2, 13, 0, Math.PI*2); ctx.fill();
    let lBtnW=180,lBtnH=40,lBtnX=(canvas.width-lBtnW)/2,lBtnY=panelY+280; uiButtons.langBtn = { x:lBtnX, y:lBtnY, w:lBtnW, h:lBtnH };
    drawMenuButton(uiButtons.langBtn, `${L.lang}: ${currentLang}`, mxIn(uiButtons.langBtn), '#ffaa00', '#aa7700');
    let nBtnW=240,nBtnH=40,nBtnX=(canvas.width-nBtnW)/2,nBtnY=panelY+335; uiButtons.nameBtn = { x:nBtnX, y:nBtnY, w:nBtnW, h:nBtnH };
    drawMenuButton(uiButtons.nameBtn, `AD: ${displayName || 'BELİRLENMEDİ'}`, mxIn(uiButtons.nameBtn), '#00ff66', '#007f3f');
    let cBtnW=140,cBtnH=40,cBtnX=(canvas.width-cBtnW)/2,cBtnY=panelY+405; uiButtons.closeBtn = { x:cBtnX, y:cBtnY, w:cBtnW, h:cBtnH }; 
    drawMenuButton(uiButtons.closeBtn, L.close, mxIn(uiButtons.closeBtn), '#ff0055', '#880022');
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
loop();
</script>
